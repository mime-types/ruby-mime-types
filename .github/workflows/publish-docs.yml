name: Publish docs

on:
  workflow_dispatch:

  workflow_call:

permissions: {}

concurrency:
  group: publish-docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  publish_docs:
    name: Publish docs from main
    runs-on: ubuntu-latest
    environment: release

    permissions:
      contents: read
      pages: write    # Publish documentation to pages
      id-token: write # Publish documentation to pages

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@5ef0c079ce82195b2a36a210272d6b661572d83e # v2.14.2
        with:
          egress-policy: audit

      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - id: rubygems
        run: |
          ruby -e \
            'print "version=", Gem::Specification.load(ARGV[0]).rubygems_version, "\n"' \
            mime-types.gemspec >>"${GITHUB_OUTPUT}"

      - uses: ruby/setup-ruby@d354de180d0c9e813cfddfcbdc079945d4be589b # v1.275.0
        with:
          bundler-cache: false
          ruby-version: ruby

      - name: Install dependencies
        run: |
          gem update --system="${RUBYGEMS_VERSION}"
          bundle install --jobs 4 --retry 3
        env:
          RUBYGEMS_VERSION: ${{ steps.rubygems.outputs.version }}

      - name: Build documentation
        run: |
          rake docs

      - name: Upload documentation artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: doc

      - name: Deploy documentation
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
